[project]
name = "emporio-agent"
version = "0.1.0"
description = "Customer-service agent prototype for Empório da Música (Artefact AI Engineer case)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.4",
    "pandas>=2.2",
    "rapidfuzz>=3.9",
    "streamlit>=1.39",
    "rich>=13.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
emporio-cli = "emporio.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emporio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
